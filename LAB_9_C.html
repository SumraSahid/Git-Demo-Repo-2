<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            border: 1px dotted gray;
            position: absolute;
            height: 500px;
            width: 1000px;
        }

        .rotate {
            position: relative;
            background-color: red;
            height: 100px;
            width: 100px;
            animation: move 4s ease-in-out alternate 2s infinite forwards;

        }

        @keyframes move {
            0% {
                height: 100px;
                width: 100px;
            }

            25% {
                height: 200px;
                width: 200px;
                background-color: blue;
            }

            50% {
                height: 300px;
                width: 300px;
                background-color: chartreuse;
            }

            75% {
                height: 200px;
                width: 200px;
                background-color: sienna;
            }

            100% {
                height: 100px;
                width: 100px;
                background-color: aqua;
            }
        }
    </style>
</head>

<body>
    <div class="container">
    <div class="rotate"></div>
</body>
</html>

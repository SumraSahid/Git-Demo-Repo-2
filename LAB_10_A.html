<!DOCTYPE html>
<html>
<head>
    <title>CSS3 Animation</title>

    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: blue;
            animation: moveBox 3s infinite;
        }

        @keyframes moveBox {
            0% {
                margin-left: 0px;
            }

            50% {
                margin-left: 300px;
            }

            100% {
                margin-left: 0px;
            }
        }
    </style>
</head>

<body>

    <h1>CSS3 Animation</h1>

    <div class="box"></div>

</body>
</html>
